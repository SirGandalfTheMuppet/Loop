<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Bar Video Diagnostic</title>
<style>
  html, body { margin: 0; background: #000; color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding: 3vw 4vw; font-size: 1.6vw; line-height: 1.4; }
  h1 { font-size: 2.4vw; margin: 0 0 1vw; }
  h2 { font-size: 1.8vw; margin: 2vw 0 0.6vw; color: #9ab; }
  .row { display: flex; gap: 1.5vw; }
  .label { flex: 0 0 55%; }
  .ok { color: #4ade80; } .bad { color: #f87171; } .wait { color: #facc15; }
  #ua, #stamp { font-size: 1.1vw; color: #bbb; word-break: break-all; }
</style>
</head>
<body>
<h1>Video diagnostic</h1>
<div id="stamp"></div>
<h2>Network</h2>
<div id="net"></div>
<h2>Streaming video formats (Media Source Extensions)</h2>
<div id="mse"></div>
<h2>Browser</h2>
<div id="ua"></div>
<script>
  document.getElementById('stamp').textContent = 'Run at ' + new Date().toLocaleString();
  document.getElementById('ua').textContent = navigator.userAgent;

  function addRow(container, label) {
    var row = document.createElement('div'); row.className = 'row';
    var l = document.createElement('div'); l.className = 'label'; l.textContent = label;
    var r = document.createElement('div'); r.className = 'wait'; r.textContent = 'Testing…';
    row.appendChild(l); row.appendChild(r); container.appendChild(row);
    return r;
  }
  function set(el, ok, text) { el.className = ok ? 'ok' : 'bad'; el.textContent = text; }

  // A no-cors request resolves if the server answers at all,
  // and rejects if the host is blocked or unreachable.
  function probe(url, ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms || 8000);
    var start = performance.now();
    return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
      .then(function () { return { ok: true, ms: Math.round(performance.now() - start) }; })
      .catch(function () { return { ok: false, err: ctrl.signal.aborted ? 'timed out' : 'blocked or unreachable' }; })
      .finally(function () { clearTimeout(timer); });
  }
  function probeImage(url, ms) {
    return new Promise(function (resolve) {
      var img = new Image();
      var timer = setTimeout(function () { resolve({ ok: false, err: 'timed out' }); }, ms || 8000);
      img.onload = function () { clearTimeout(timer); resolve({ ok: true }); };
      img.onerror = function () { clearTimeout(timer); resolve({ ok: false, err: 'failed to load' }); };
      img.src = url + '?t=' + Date.now();
    });
  }

  var net = document.getElementById('net');
  var checks = [
    ['Control: google.com', function () { return probe('https://www.google.com/generate_204'); }],
    ['YouTube player (youtube-nocookie.com)', function () { return probe('https://www.youtube-nocookie.com/'); }],
    ['YouTube thumbnails (ytimg.com)', function () { return probeImage('https://i.ytimg.com/vi/MPY_EuvimH0/hqdefault.jpg'); }],
    ['YouTube video servers (googlevideo.com)', function () { return probe('https://redirector.googlevideo.com/'); }]
  ];
  checks.forEach(function (c) {
    var el = addRow(net, c[0]);
    c[1]().then(function (r) {
      set(el, r.ok, r.ok ? ('Reachable' + (r.ms ? ' (' + r.ms + ' ms)' : '')) : ('FAILED: ' + r.err));
    });
  });

  var mse = document.getElementById('mse');
  var MS = window.MediaSource || window.ManagedMediaSource || window.WebKitMediaSource;
  var exists = addRow(mse, 'Media Source Extensions available');
  if (!MS) {
    set(exists, false, 'NO: YouTube cannot stream in this browser');
  } else {
    set(exists, true, 'Yes');
    [
      ['H.264 video (mp4)', 'video/mp4; codecs="avc1.4d401f"'],
      ['VP9 video (webm)', 'video/webm; codecs="vp9"'],
      ['AV1 video (mp4)', 'video/mp4; codecs="av01.0.05M.08"'],
      ['AAC audio (mp4)', 'audio/mp4; codecs="mp4a.40.2"'],
      ['Opus audio (webm)', 'audio/webm; codecs="opus"']
    ].forEach(function (t) {
      var el = addRow(mse, t[0]);
      var ok = false;
      try { ok = MS.isTypeSupported(t[1]); } catch (e) { ok = false; }
      set(el, ok, ok ? 'Supported' : 'Not supported');
    });
  }
</script>
</body>
</html>
