<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- loop=1 only works when playlist is set to the same video ID.
     Remove "&mute=1" to try for sound; if the player then sits on the thumbnail, put it back. -->
<iframe
  src="https://www.youtube-nocookie.com/embed/MPY_EuvimH0?autoplay=1&mute=1&loop=1&playlist=MPY_EuvimH0&controls=0&rel=0&playsinline=1"
  title="Video loop"
  allow="autoplay; encrypted-media; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>
</body>
</html>
