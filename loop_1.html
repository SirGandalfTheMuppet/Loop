<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video Loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The player is drawn at 1280x720 so YouTube picks a 720p stream,
     then scaled up to fill the screen. */
  iframe {
    position: absolute; top: 50%; left: 50%;
    width: 1280px; height: 720px; border: 0;
    transform-origin: center center;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
<!-- loop=1 only works when playlist is set to the same video ID. -->
<iframe id="player"
  src="https://www.youtube-nocookie.com/embed/MPY_EuvimH0?autoplay=1&mute=1&loop=1&playlist=MPY_EuvimH0&controls=0&rel=0&playsinline=1"
  title="Video loop"
  allow="autoplay; encrypted-media; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin"
  allowfullscreen></iframe>
<script>
  const player = document.getElementById('player');
  function fit() {
    const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    player.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
